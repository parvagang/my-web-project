<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style = "color: rgb(108, 169, 255);">Hello, World!</h1>
    <h2 style = "color: blue;">Welcome to my website!</h2>
    <h3 style = "color: rgb(32, 248, 71);">About Me</h3>
    <h3 style = "color: rgb(255, 108, 169);">My Hobbies</h3>
    <h3 style = "color: rgb(108, 255, 169);">Reading Fiction:</h3>
    <h3 style = "color: rgb(255, 0, 30);">Favorite fictional novels ordered</h3>
    <ol>
        <li >Reverend Insanity</li>
        <li>Lord of the Mysteries</li>
        <li>Shadow Slave</li>
    </ol>
    <h3 style = "color: rgb(0, 255, 255);">Favorite fictional novels unordered</h3>
    <ul>
        <li>Reverend Insanity</li>
        <li>Lord of the Mysteries</li>
        <li>Shadow Slave</li>
    </ul>
    <form>
        <label for="email">enter your email:</label>
        <input type="email" id="email" name="email" required placeholder="enter your email">
        <br> <br>
        <label for="password">enter your password:</label>
        <input type="password" id="password" name="password" required placeholder="enter your password">
        <br> <br>
        <label for="remember">Remember me:</label>
        <input type="checkbox" id="remember" name="remember">
        <br> <br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br> <br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
